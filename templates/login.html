{% extends "base.html" %}

{% block content %}
<div class="w-full flex items-center justify-center min-h-[80vh] relative z-10">
    <div class="w-full max-w-md px-6">
        <!-- Logo/Brand -->
        <div class="mb-8 text-center">
            <h1 class="text-5xl mb-2 tracking-wider orbitron bg-gradient-to-r from-purple-400 via-pink-300 to-purple-400 bg-clip-text text-transparent" style="filter: drop-shadow(0 0 20px rgba(168, 85, 247, 0.8)) drop-shadow(0 0 40px rgba(168, 85, 247, 0.5)) drop-shadow(0 0 60px rgba(168, 85, 247, 0.3))">
                SocialtrackX
            </h1>
            <p class="text-purple-300 text-sm" style="text-shadow: 0 0 10px rgba(216, 180, 254, 0.5);">Social Media Intelligence Platform</p>
        </div>

        <!-- Glass Login Form -->
        <div class="glass-panel rounded-2xl p-8 shadow-2xl shadow-purple-500/20" style="box-shadow: 0 0 40px rgba(168, 85, 247, 0.2), inset 0 0 40px rgba(168, 85, 247, 0.05)">
            <h2 class="text-2xl mb-6 text-center text-purple-200 orbitron">Welcome back investigator</h2>

            {% if error %}
            <div class="bg-red-900/40 border border-red-500/50 text-red-300 px-4 py-3 rounded-lg mb-6 text-sm text-center">
                {{ error }}
            </div>
            {% endif %}

            <form method="POST" action="/login" class="space-y-5">
                <!-- Username Input -->
                <div>
                    <label for="username" class="block text-sm mb-2 text-purple-200/90">Username</label>
                    <input id="username" name="username" type="text"
                        class="w-full px-4 py-3 rounded-lg bg-white/5 border border-purple-400/20 text-white placeholder-purple-300/30 focus:outline-none focus:border-purple-400/70 focus:bg-white/10 backdrop-blur-sm transition-all shadow-[0_0_10px_rgba(168,85,247,0.1)]"
                        placeholder="Enter your username" required autofocus />
                </div>

                <!-- Password Input -->
                <div>
                    <label for="password" class="block text-sm mb-2 text-purple-200/90">Password</label>
                    <input id="password" name="password" type="password"
                        class="w-full px-4 py-3 rounded-lg bg-white/5 border border-purple-400/20 text-white placeholder-purple-300/30 focus:outline-none focus:border-purple-400/70 focus:bg-white/10 backdrop-blur-sm transition-all shadow-[0_0_10px_rgba(168,85,247,0.1)]"
                        placeholder="Enter your password" required />
                </div>

                <!-- Info Note -->
                <div class="text-center">
                    <p class="text-xs text-purple-300/50">Access credentials are provided by administration</p>
                </div>

                <!-- Login Button -->
                <button type="submit"
                    class="w-full py-3 rounded-lg bg-gradient-to-r from-purple-500/30 to-pink-500/30 border border-purple-400/50 text-white backdrop-blur-md hover:from-purple-500/40 hover:to-pink-500/40 hover:border-purple-400/70 hover:scale-105 transition-all duration-300 active:scale-[0.98]"
                    style="box-shadow: 0 0 20px rgba(168, 85, 247, 0.4), 0 0 40px rgba(168, 85, 247, 0.2), inset 0 0 20px rgba(168, 85, 247, 0.1); text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);">
                    Sign In
                </button>
            </form>
        </div>
        
        <!-- Footer Note -->
        <p class="mt-8 text-center text-xs text-purple-400/40">Secure access to criminal intelligence data</p>
    </div>
</div>
{% endblock %}
