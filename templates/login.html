{% extends "base.html" %}

{% block content %}
<div style="max-width: 400px; margin: 80px auto;">
    <div class="glass-card">
        <h2 style="margin-top: 0; text-align: center;">Secure Login</h2>
        <p style="text-align: center; color: var(--text-dim); margin-bottom: 32px;">Forensic Evidence Collection System</p>
        
        {% if error %}
        <div style="background: rgba(239, 68, 68, 0.2); color: #f87171; padding: 12px; border-radius: 8px; margin-bottom: 16px;">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST" action="/login">
            <div class="form-group">
                <label class="form-label">Username</label>
                <input type="text" name="username" class="form-input" required autofocus>
            </div>
            <div class="form-group">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-input" required>
            </div>
            <button type="submit" class="btn" style="width: 100%; margin-top: 16px;">Authenticate</button>
        </form>
    </div>
</div>
{% endblock %}
